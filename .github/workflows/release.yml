name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: hash_tools
            asset_name: hash_tools-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: hash_tools.exe
            asset_name: hash_tools-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: hash_tools
            asset_name: hash_tools-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: hash_tools
            asset_name: hash_tools-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  # Sign Windows binary with SignPath
  sign-windows:
    name: Sign Windows Binary
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: hash_tools-windows-x86_64.exe

      - name: Sign with SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: hash-tools
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-executable
          github-artifact-id: hash_tools-windows-x86_64.exe
          wait-for-completion: true
          output-artifact-name: hash_tools-windows-x86_64-signed.exe

  release:
    name: Create Release
    needs: [build, sign-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            hash_tools-linux-x86_64/*
            hash_tools-windows-x86_64-signed.exe/*
            hash_tools-macos-x86_64/*
            hash_tools-macos-arm64/*
          generateReleaseNotes: true
          draft: false
          prerelease: false
