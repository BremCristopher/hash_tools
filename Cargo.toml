[package]
name = "hash_tools"
version = "0.1.0"
edition = "2021"
description = "Cross-platform file hashing and PDF signature digest analysis with SM3/SM2 support"
license = "MIT"
repository = "https://github.com/BremCristopher/hash_tools"

[features]
default = []
_windows_build = []

[dependencies]
iced = { version = "0.14.0", features = ["tokio", "advanced", "canvas", "svg"] }
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "macros"] }
rfd = "0.15"
hex = "0.4"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
md-5 = "0.10"
blake3 = "1.5"
anyhow = "1.0"
thiserror = "2.0"
sm3 = "0.4.2"
lopdf = "0.34"
libsm = "0.6"           # SM2/SM3/SM4 Chinese national crypto
cms = "0.2"             # PKCS#7/CMS parsing
x509-cert = "0.2"       # X.509 certificate parsing
der = "0.7"             # DER encoding/decoding
chrono = "0.4.42"
asn1-rs = "0.7.1"
tera = "1.20.1"
serde = { version = "1.0.228", features = ["derive"] }
image = "0.25.9"
rayon = "1.10"

# Windows-specific metadata for executable
[package.metadata.winres]
OriginalFilename = "hash_tools.exe"
ProductName = "Hash Tools"
FileDescription = "Modern file hash calculator"

# Release profile for smaller binaries
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"

# Build dependencies (for Windows resource embedding)
[build-dependencies]
winresource = "0.1"
